<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login — Sistem Arsip</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<style>
body{display:flex;justify-content:center;align-items:center;padding:20px;}
.login-wrap{background:#fff;border-radius:20px;padding:35px;width:100%;max-width:380px;box-shadow:0 20px 40px rgba(0,0,0,.35);}
.login-wrap h1{margin:0 0 4px;color:#091540;font-size:22px;}
.login-wrap p{margin:0 0 20px;color:#7a86a8;font-size:13px;}
.login-wrap label{display:block;font-weight:700;color:#091540;font-size:12px;margin:14px 0 5px;}
.login-wrap input{width:100%;padding:11px;border:1.5px solid #d6dbef;border-radius:9px;font-size:14px;box-sizing:border-box;}
.login-wrap input:focus{outline:none;border-color:#1B2CC1;}
.login-wrap button{width:100%;margin-top:20px;padding:12px;border:none;border-radius:9px;background:linear-gradient(135deg,#1B2CC1,#091540);color:#fff;font-weight:bold;font-size:14px;cursor:pointer;}
.login-wrap button:hover{opacity:.9;}
.err{background:#fde2e4;color:#8b0e1a;padding:10px;border-radius:8px;font-size:13px;margin-bottom:15px;}
</style>
</head>
<body>
<div class="login-wrap">
  <h1>📁 Sistem Arsip</h1>
  <p>Silakan login untuk melanjutkan</p>

  {% if gagal1 %}<div class="err">{{ gagal1 }}</div>{% endif %}

  <form method="POST" action="{{ url_for('login') }}">
    <label>Nama</label>
    <input type="text" name="name" required autofocus>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Masuk</button>
  </form>
</div>
</body>
</html>
